name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: yaml
          tools: composer:v2
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint
      - run: composer test
      - run: composer examples

  sdk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: 'mcp>=1.28,<2'
            client: client_v1.py
          - sdk: 'mcp>=2,<3'
            client: client_v2.py
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: yaml
          tools: composer:v2
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: composer install --no-interaction --prefer-dist
      - run: python -m pip install '${{ matrix.sdk }}'
      - name: Exercise actual HTTP endpoint with independent MCP client
        shell: bash
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8099 -t examples/public examples/public/index.php > /tmp/brace-mcp.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; cat /tmp/brace-mcp.log' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --output /dev/null http://127.0.0.1:8099/mcp; then break; fi
            sleep 1
          done
          python 'test/integration/${{ matrix.client }}'
